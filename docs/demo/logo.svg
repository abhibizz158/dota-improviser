  <path d="M64 11 L52 52 L64 64 Z M117 64 L76 52 L64 64 Z M64 117 L76 76 L64 64 Z M11 64 L52 76 L64 64 Z" fill="url(#gold)"/>
  <path d="M64 54 L74 64 L64 74 L54 64 Z" fill="#d8402f" stroke="#ffe9b4" stroke-width="2"/>
</svg>
