<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Dota Improviser">
  <!-- Original art for Dota Improviser: a compass spark. Source of every app and site icon (scripts/make-icons.mjs). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#4a1715"/><stop offset=".55" stop-color="#210d0e"/><stop offset="1" stop-color="#0b0909"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9b4"/><stop offset="1" stop-color="#c08a35"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9822f"/><stop offset="1" stop-color="#6d4416"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b862"/><stop offset="1" stop-color="#8d2b22"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="126" height="126" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="26" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <circle cx="64" cy="64" r="37" fill="none" stroke="#e3b862" stroke-opacity=".32" stroke-width="4"/>
  <!-- long north point, shorter others: each point split into a lit and a shaded half -->
