name: Build desktop test release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            command: package:win
            package-dir: Dota Improviser-win32-x64
          - platform: macos-arm64
            runner: macos-15
            command: package:mac
            package-dir: Dota Improviser-darwin-arm64
          - platform: macos-x64
            runner: macos-15-intel
            command: package:mac-intel
            package-dir: Dota Improviser-darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PLATFORM: ${{ matrix.platform }}
      PACKAGE_DIR: ${{ matrix.package-dir }}
      PACKAGE_COMMAND: ${{ matrix.command }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - shell: bash
        run: npm run "$PACKAGE_COMMAND"
      - name: Run application tests against the packaged build inputs
        shell: bash
        run: node --test tests/*.test.mjs
      - name: Verify and archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="release/$PACKAGE_DIR/Dota Improviser.app"
          helper="$app/Contents/Resources/app.asar.unpacked/dist/main/main/overlay-window.node"
          driver="$PWD/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          ELECTRON_RUN_AS_NODE=1 "$driver" scripts/smoke-overlay-module.cjs "$helper"
          mkdir -p artifacts
          version=$(node -p 'require("./package.json").version')
          installer="artifacts/Dota-Improviser-${version}-$PLATFORM.pkg"
          bash scripts/build-macos-pkg.sh "$app" "$installer" "$version"
          sudo /usr/sbin/installer -pkg "$installer" -target /
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' '/Applications/Dota Improviser.app/Contents/Info.plist')" = "$version"
          node scripts/package-app.mjs darwin "${PLATFORM#macos-}" /Applications
      - name: Verify and archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "release/$env:PACKAGE_DIR"
          $helper = Join-Path $package 'resources/app.asar.unpacked/dist/main/main/overlay-window.node'
          $driver = node -p 'require("electron")'
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $driver scripts/smoke-overlay-module.cjs $helper | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $version = node -p 'require("./package.json").version'
          $compiler = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $output = "$PWD/artifacts/Dota-Improviser-$version-$env:PLATFORM-setup.exe"
          $source = (Resolve-Path $package).Path
          & $compiler "/DAPP_DIR=$source" "/DOUTPUT_FILE=$output" scripts/windows-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installation = Start-Process -FilePath $output -ArgumentList '/S' -Wait -PassThru
          if ($installation.ExitCode -ne 0) { exit $installation.ExitCode }
          $installed = "$env:LOCALAPPDATA/Programs/Dota Improviser"
          node scripts/package-app.mjs win32 x64 $installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
